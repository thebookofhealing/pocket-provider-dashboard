name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pocket-provider-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VM
    if: github.repository == 'tsulhc/pocket-provider-dashboard' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - x64
      - pocket-provider-production
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Deploy release
        env:
          DEPLOY_ROOT: /srv/pocket-provider-dashboard
          KEEP_RELEASES: "5"
          HEALTH_URL: http://127.0.0.1:3100/api/health
        run: bash scripts/deploy-production.sh

      - name: Verify production data contract
        if: success()
        env:
          LOCAL_BASE_URL: http://127.0.0.1:3100
          EXPECTED_SHA: ${{ github.sha }}
          PUBLIC_HEALTH_URL: https://pocket-providers.kleomed.es/api/health
        run: bash scripts/verify-production-data.sh
