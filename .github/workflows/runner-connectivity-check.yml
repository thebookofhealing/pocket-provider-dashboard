name: Runner connectivity check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on:
      - self-hosted
      - linux
      - x64
      - pocket-provider-production
    timeout-minutes: 5
    steps:
      - name: Verify dedicated runner only
        shell: bash
        run: |
          set -eu
          test "$RUNNER_NAME" = "pocket-provider-prod-1"
          test "$(id -un)" = "pocketdeploy"
          node --version
          npm --version
          pm2 --version
          printf 'runner_connectivity=ok\n'
